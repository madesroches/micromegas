[package]
name = "micromegas-transit"
description = "Zero-copy binary serialization for plain-old-data structs, with reflection metadata for decoding heterogeneous event queues. From the Micromegas project."
keywords = ["serialization", "binary", "pod", "encoding", "zero-copy"]
categories = ["development-tools::profiling", "development-tools::debugging", "encoding"]
version.workspace = true
edition.workspace = true
homepage = "https://docs.rs/micromegas-transit"
repository.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
micromegas-derive-transit = { path = "derive", version = "^0.32" }

anyhow.workspace = true
bumpalo.workspace = true
lazy_static.workspace = true
serde.workspace = true
uuid.workspace = true

# can't use micromegas-tracing, would cause a circular dependency
log.workspace = true

[dev-dependencies]
memoffset.workspace = true
