# cargo-audit configuration — see https://docs.rs/cargo-audit
#
# Add an advisory ID here ONLY when it cannot be resolved by a dependency
# bump — either no fixed version exists (vulnerabilities) or the crate is
# unmaintained with no maintained drop-in (informational warnings). Every
# entry MUST carry a comment: the advisory URL/ID, why it can't be fixed
# now, and a condition for removal. Revisit on each dependency bump — remove
# the ignore as soon as a fix ships or the dependency drops the crate.
[advisories]
ignore = [
    # rsa 0.9.10, in micromegas-auth. RUSTSEC-2023-0071 is the "Marvin"
    # timing side-channel, which affects RSA *private-key* operations
    # (decryption/signing). This crate only ever does public-key work:
    # OIDC token signature *verification* (RS256 via jsonwebtoken decode,
    # RsaPublicKey built from JWK n/e). The signing path exists only in
    # auth's tests, so the vulnerable operation is not exercised in
    # production. Low risk here on those grounds alone.
    #
    # No fix is available and there is no upgrade path: rsa enters via THREE
    # paths -- jsonwebtoken (rust_crypto feature), a direct dep in auth, and
    # openidconnect 4.0.1 (pulls rsa in its default features). openidconnect
    # 4.0.1 is the latest published release, so bumping it cannot drop rsa,
    # and swapping jsonwebtoken alone leaves the openidconnect path. Clearing
    # this requires the OIDC stack to move off the pure-Rust rsa crate.
    # Revisit when rsa ships a fix or openidconnect drops it; tracked under #1246.
    "RUSTSEC-2023-0071",

    # quick-xml 0.39.4 (via object_store 0.13.2): DoS in XML parsing of
    # object-store list responses. Fix is quick-xml >=0.41.0, but
    # object_store 0.13.2 pins ^0.39 and object_store is in turn pinned by
    # datafusion 54. Cannot bump within semver today. Remove once datafusion
    # bumps object_store to a release that pulls quick-xml >=0.41. Revisit when
    # a fix ships; rollout tracked under #1246.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # paste 1.0.15 (RUSTSEC-2024-0436): unmaintained, not a vulnerability.
    # Pulled transitively by the Arrow/Foyer stack (arrow-flight, foyer-memory)
    # as a proc-macro; there is no maintained drop-in and nothing to bump on
    # our side. Remove when those upstreams stop depending on `paste`.
    "RUSTSEC-2024-0436",

    # proc-macro-error2 2.0.1 (RUSTSEC-2026-0173): unmaintained, not a
    # vulnerability. A build-time proc-macro reached transitively via
    # defmt-macros; no maintained replacement and nothing to bump on our side.
    # Remove when the dependency drops it.
    "RUSTSEC-2026-0173",

    # crypto-bigint 0.5.5 (RUSTSEC-2026-0387): constant-time timing variability.
    # Fix is >=0.7.6, but it is pinned ^0.5 by elliptic-curve 0.13, which
    # p256/p384 0.13 reach via jsonwebtoken 11.1.0 and openidconnect 4.0.1
    # (both latest releases). We only verify ES256/ES384 signatures over
    # public keys, so no secret-dependent arithmetic runs in production.
    # Remove once jsonwebtoken/openidconnect move to RustCrypto curves built
    # on crypto-bigint >=0.7.
    "RUSTSEC-2026-0387",

    # zstd 0.13.3 / zstd-safe 7.x / zstd-sys 2.0 (RUSTSEC-2026-0391, 0395-0406, 0410):
    # memory-safety advisories in the zstd bindings. Fixes need zstd >=0.14.3 /
    # zstd-safe >=8.2.0, but datafusion 55.2.0 (plus arrow-ipc, parquet,
    # compression-codecs and foyer-storage) pin zstd 0.13, so a lockfile bump cannot
    # reach them. Remove once datafusion moves to zstd 0.14; tracked under #1731.
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0395",
    "RUSTSEC-2026-0396",
    "RUSTSEC-2026-0397",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0399",
    "RUSTSEC-2026-0400",
    "RUSTSEC-2026-0401",
    "RUSTSEC-2026-0402",
    "RUSTSEC-2026-0403",
    "RUSTSEC-2026-0404",
    "RUSTSEC-2026-0405",
    "RUSTSEC-2026-0406",
    "RUSTSEC-2026-0410",
]
