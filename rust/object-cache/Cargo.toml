[package]
name = "micromegas-object-cache"
description = "Range-aware read cache for `object_store`: a byte-range cache engine plus an ObjectStore client that routes reads through a shared cache service and falls back to the origin. From the Micromegas project."
keywords = ["object-store", "cache", "s3", "parquet", "range-requests"]
categories = ["caching"]
version.workspace = true
edition.workspace = true
homepage = "https://micromegas.info/docs/architecture/caching/"
repository.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
foyer = ["dep:foyer", "dep:foyer-common"]

[dependencies]
micromegas-tracing.workspace = true

anyhow.workspace = true
async-stream.workspace = true
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
foyer-memory.workspace = true
futures.workspace = true
object_store.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

foyer = { workspace = true, optional = true }
foyer-common = { workspace = true, optional = true }

[dev-dependencies]
micromegas-transit.workspace = true

object_store.workspace = true
serial_test = "3.2"
tempfile = "3.14"
tokio.workspace = true
