# Some object-cache-srv integration tests drive real components (real disk
# I/O through `FoyerBackend`, real background tasks) against a tight
# wall-clock deadline. `cargo nextest run` runs test binaries concurrently
# across the whole workspace (unlike `cargo test`, which serializes binaries
# but still runs a binary's own tests on parallel threads by default), and
# right after a cold build that cross-binary contention alone can push a 5s
# deadline over the edge. A `test-groups` `max-threads` override only bounds
# concurrency *within* the group -- a group test still occupies just one slot
# of the global thread pool, so nextest keeps filling the rest with the other
# ~1500 tests in the workspace. `threads-required = "num-test-threads"` is
# what actually gives these tests exclusive use of the machine, by reserving
# the whole configured thread pool for the duration of each one. Run this
# group with reduced parallelism instead of widening the deadlines, which
# would only mask a real regression.
[test-groups.serial-integration]
max-threads = 1

[[profile.default.overrides]]
filter = 'binary_id(micromegas-object-cache-srv::shutdown_sequence_tests)'
test-group = 'serial-integration'
threads-required = 'num-test-threads'
