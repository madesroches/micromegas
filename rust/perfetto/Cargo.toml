[package]
name = "micromegas-perfetto"
description = "Streaming writer for Perfetto trace files: encodes thread and async spans as protobuf TracePackets, with bundled Perfetto proto bindings. From the Micromegas project."
keywords = ["perfetto", "trace", "profiling", "protobuf", "chrome-tracing"]
categories.workspace = true
version.workspace = true
edition.workspace = true
homepage = "https://docs.rs/micromegas-perfetto"
repository.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
datafusion.workspace = true
prost.workspace = true
prost-build = { version = "0.13", optional=true }
tokio.workspace = true
xxhash-rust.workspace = true

[features]
protogen = ["prost-build"]

[[bin]]
name = "update-perfetto-protos"
path = "src/update_perfetto_protos.rs"
required-features = ["protogen"]