# cargo-audit configuration for the datafusion-wasm tree.
#
# This crate is excluded from the main workspace and has its own Cargo.lock,
# and cargo-audit has no --config flag and does not inherit a parent
# directory's config, so ignores for this tree must live here (see
# ../.cargo/audit.toml for the main-tree list and the ignore policy).
[advisories]
ignore = [
    # paste 1.0.15 (RUSTSEC-2024-0436): unmaintained, not a vulnerability.
    # Pulled transitively by the Arrow stack as a proc-macro; no maintained
    # drop-in and nothing to bump on our side. Remove when upstream drops it.
    "RUSTSEC-2024-0436",

    # chrono 0.4.45 (RUSTSEC-2026-0543), chrono-tz 0.10.4 (RUSTSEC-2026-0555),
    # humantime 2.3.0 (RUSTSEC-2026-0542): unmaintained, not vulnerabilities.
    # All three come from the same upstream notice (chrono issue 1768) and no
    # safe upgrade exists; arrow, parquet and datafusion expose chrono types in
    # their public APIs. Remove once those upstreams drop chrono.
    "RUSTSEC-2026-0543",
    "RUSTSEC-2026-0555",
    "RUSTSEC-2026-0542",

    # pin-utils 0.1.0 (RUSTSEC-2026-0441): unmaintained, not a vulnerability.
    # Pulled transitively by the futures stack; nothing to bump on our side.
    # Remove when upstream drops it.
    "RUSTSEC-2026-0441",
]
